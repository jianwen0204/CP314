<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CP314 Point Card</title>
<style>
:root{
  --paper:#E4E2DC; --panel:#F5F4F1; --ink:#16232A; --ink2:#516268;
  --rule:#C6C3BB; --hole:#8A9298;
  --treat:#B23A2F; --check:#8C5F08;
  --pri:#1D4E6E; --sec:#6B4E93; --ter:#7A6A55;
  --tap:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 72px}

/* ---- sticky point bar + tabs ---- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);
  padding:10px 12px 0;margin:0 -12px;border-bottom:1px solid var(--rule)}
.topin{max-width:736px;margin:0 auto}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px}
.nav{flex:0 0 auto;width:clamp(40px,12vw,52px);height:var(--tap);border:1px solid var(--rule);
  background:#fff;color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.nav:disabled{opacity:.35}
.now{flex:1 1 130px;display:flex;align-items:baseline;justify-content:center;
  gap:8px;min-width:0;flex-wrap:wrap;row-gap:4px}
.now b{font-size:clamp(24px,8vw,34px);font-weight:700;line-height:1;white-space:nowrap;flex:0 0 auto}
.tag{font-size:11px;font-weight:700;color:#fff;padding:3px 7px;white-space:nowrap;flex:0 0 auto}
.all{flex:0 0 auto;height:var(--tap);padding:0 clamp(7px,2.5vw,12px);border:1px solid var(--rule);
  background:#fff;color:var(--ink);font:600 13px/1 inherit;cursor:pointer}
.sheet{display:none;position:fixed;left:0;right:0;bottom:0;top:76px;z-index:30;
  background:var(--paper);border-top:1px solid var(--rule);padding:10px 12px 20px;overflow:auto;
  -webkit-overflow-scrolling:touch}
.sheet.open{display:block}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;
  max-width:736px;margin:0 auto}
.sheet .close{display:block;width:100%;max-width:736px;margin:0 auto 10px;min-height:46px;
  border:1px solid var(--rule);background:#fff;font:700 14px/1 inherit;color:var(--ink);cursor:pointer}
.chip{min-height:46px;border:1px solid var(--rule);background:#fff;color:var(--ink);
  font:600 16px/1 inherit;font-variant-numeric:tabular-nums;cursor:pointer;
  border-left:5px solid var(--ter)}
.chip[data-t="Primary"]{border-left-color:var(--pri)}
.chip[data-t="Secondary"]{border-left-color:var(--sec)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs{display:flex;gap:0;margin-top:10px}
.tab{flex:1;min-height:var(--tap);border:1px solid var(--rule);border-bottom:0;
  background:#DCDAD3;color:var(--ink2);font:700 15px/1 inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);
  box-shadow:inset 0 3px 0 var(--ink)}
button:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

/* ---- panels ---- */
.panel{background:var(--panel);border:1px solid var(--rule);border-top:0;
  padding:16px 14px;margin:0 -12px 14px;}
h2{font-size:13px;font-weight:700;margin:20px 0 8px}
h2:first-child{margin-top:0}
.lede{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.lede .v{font-size:clamp(30px,10.5vw,44px);font-weight:700;line-height:1}
.lede .u{font-size:18px;font-weight:700}
.lede .k{font-size:13px;color:var(--ink2);flex-basis:100%}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:9px 14px;font-size:16px}
dt{color:var(--ink2)}
dd{margin:0;text-align:right;font-weight:700}
dl+h2{margin-top:22px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#fff;border:1px solid var(--rule);padding:10px 12px}
.box .k{font-size:12px;color:var(--ink2)}
.box .v{font-size:20px;font-weight:700}

/* ---- stage cards ---- */
.banner{background:#F6E8DF;border:1px solid #C98F6E;border-left:5px solid var(--treat);
  padding:10px 12px;margin:0 -12px 12px;font-size:13px;line-height:1.5}
.banner b{display:block;margin-bottom:2px}
.seg{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.seg button{flex:1 1 84px;min-height:52px;border:1px solid var(--rule);background:#fff;
  color:var(--ink);font:600 13px/1.25 inherit;cursor:pointer;padding:6px 4px}
.seg button b{display:block;font-size:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.crit{background:#fff;border:1px solid var(--rule);padding:11px 13px;margin-top:10px;font-size:14px}
.crit h4{margin:0 0 7px;font-size:13px}
.crit ul{margin:0;padding-left:18px}
.crit li{margin-bottom:5px;line-height:1.45}
.foot{font-size:12px;color:var(--ink2);line-height:1.55;margin-top:18px;
  border-top:1px solid var(--rule);padding-top:12px}
.stage{background:#fff;border:1px solid var(--rule);border-left:6px solid var(--treat);
  margin-bottom:12px}
.stage .hd{display:flex;align-items:center;gap:10px;padding:11px 13px;
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.stage .no{font-size:17px;font-weight:700;min-width:0}
.stage .vol{margin-left:auto;font-size:19px;font-weight:700}
.span{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.span.two{grid-template-columns:repeat(2,1fr)}
.span>div{padding:11px 5px;min-width:0;border-left:1px solid var(--rule)}
.span>div:first-child{border-left:0}
.span .mid{display:none}
.span .k{font-size:12px;color:var(--ink2)}
.span .v{font-size:clamp(17px,6.4vw,27px);font-weight:700;line-height:1.15;
  overflow-wrap:anywhere}
.span .u{font-size:12px;color:var(--ink2)}
@media(min-width:520px){
  .span{grid-template-columns:1fr 34px 1fr 34px 1fr}
  .span.two{grid-template-columns:1fr 40px 1fr}
  .span .mid{display:flex;align-items:center;justify-content:center;
    color:var(--ink2);font-size:19px;padding:0}
}
.steps{margin:0;padding:11px 13px 13px;list-style:none;display:grid;gap:8px;
  border-top:1px solid var(--rule);background:var(--panel)}
.step{border:1px solid var(--rule);background:#fff;padding:9px 11px;
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline}
.step .n{font-size:12px;color:var(--ink2);font-weight:700}
.step .wc{font-size:17px;font-weight:700}
.step .lt{font-size:17px;font-weight:700;text-align:right}
.step .ck{grid-column:1/-1;font-size:13px;color:var(--check);line-height:1.4}

svg{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--rule)}
.hint{font-size:13px;color:var(--ink2);margin:8px 0 0}
.note{font-size:13px;color:var(--ink2);line-height:1.55;margin:16px 0 0;
  border-top:1px solid var(--rule);padding-top:12px}
.note b{color:var(--ink)}
.dir{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-top:14px;flex-wrap:wrap}
.dir select{font:inherit;font-size:14px;min-height:44px;padding:0 8px;border:1px solid var(--rule);background:#fff;color:var(--ink)}
@media(min-width:700px){
  .banner{margin:0 0 12px}
  .wrap{padding:0 16px 72px}
  .panel{margin:0 0 14px;padding:20px}
  .top{margin:0;padding:12px 0 0}
  .steps{grid-template-columns:repeat(3,1fr)}
  .step{grid-template-columns:1fr;align-content:start}
  .step .lt{text-align:left}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="topin">
  <div class="stepper">
    <button class="nav" id="prev" type="button" aria-label="Previous point">&#8249;</button>
    <div class="now"><b id="nowId">001</b><span class="tag" id="nowTag">Tertiary</span></div>
    <button class="nav" id="next" type="button" aria-label="Next point">&#8250;</button>
    <button class="all" id="allBtn" type="button" aria-expanded="false">All 63</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabD" role="tab" aria-selected="true" aria-controls="panelD">Drilling</button>
    <button class="tab" id="tabG" role="tab" aria-selected="false" aria-controls="panelG">Grouting</button>
  </div>
</div></div>

<div class="sheet" id="sheet">
  <button class="close" id="closeSheet" type="button">Close</button>
  <div class="grid" id="chips"></div>
</div>

<section class="panel" id="panelD" role="tabpanel" aria-labelledby="tabD"></section>
<section class="panel" id="panelG" role="tabpanel" aria-labelledby="tabG" hidden></section>
</div>

const RATE=350, STAGE=5, SPLIT=[[1.5,500],[1.2,1000],[1.0,250]], FULL=1750;
const PMIN=10, PMAX=15, FLOW=2;              // drawing: Pmax 10-15 bar, flow < 2 L/m/min
const COL={Primary:'var(--pri)',Secondary:'var(--sec)',Tertiary:'var(--ter)'};
const f=(v,n=2)=>Number(v).toFixed(n);
let cur=0, dir='up', tab='D', stg=0;

const chips=document.getElementById('chips'), sheet=document.getElementById('sheet');
DATA.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='chip'; b.type='button'; b.textContent=p.id;
  b.dataset.t=p.type; b.setAttribute('aria-pressed','false');
  b.onclick=()=>{select(i);openSheet(false);};
  chips.appendChild(b);
});
function openSheet(o){
  sheet.classList.toggle('open',o);
  document.getElementById('allBtn').setAttribute('aria-expanded',o?'true':'false');
  document.body.style.overflow=o?'hidden':'';
}
document.getElementById('allBtn').onclick=()=>openSheet(!sheet.classList.contains('open'));
document.getElementById('closeSheet').onclick=()=>openSheet(false);
document.getElementById('prev').onclick=()=>select(cur-1);
document.getElementById('next').onclick=()=>select(cur+1);
document.getElementById('tabD').onclick=()=>{setTab('D');render();};
document.getElementById('tabG').onclick=()=>{setTab('G');render();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')openSheet(false);
  if(e.key==='ArrowRight'){select(cur+1);e.preventDefault();}
  if(e.key==='ArrowLeft'){select(cur-1);e.preventDefault();}
});
function setTab(t){
  tab=t;
  for(const [k,tb,pn] of [['D','tabD','panelD'],['G','tabG','panelG']]){
    document.getElementById(tb).setAttribute('aria-selected',k===t?'true':'false');
    document.getElementById(pn).hidden = k!==t;
  }
}
function select(i){
  if(i<0||i>=DATA.length)return;
  cur=i; stg=0; render(); window.scrollTo({top:0,behavior:'smooth'});
}

function stagesFor(p){
  const len=p.tl, n=Math.max(1,Math.ceil(len/STAGE)), out=[];
  for(let k=0;k<n;k++){
    const l=Math.min(STAGE,len-k*STAGE);
    let from,to;
    if(dir==='up'){ to=p.ge-k*STAGE; from=to-l; } else { from=p.gs+k*STAGE; to=from+l; }
    out.push({no:k+1,from,to,len:l,vol:l*RATE});
  }
  if(out.length>1 && out[out.length-1].len<1){
    const s=out.pop(), prev=out[out.length-1];
    if(dir==='up') prev.from=s.from; else prev.to=s.to;
    prev.len+=s.len; prev.vol=prev.len*RATE;
  }
  return out;
}

function section(p,withStages,active){
  const H=330,TOP=30,BOT=20,W=300,x=118,bw=30;
  const sc=(H-TOP-BOT)/p.ge, y=d=>TOP+d*sc, lvl=d=>p.egl-d*Math.cos(p.ang*Math.PI/180);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Section of point ${p.id}">
   <rect x="${x}" y="${y(0)}" width="${bw}" height="${y(p.ge)-y(0)}" fill="#fff" stroke="var(--hole)"/>
   <rect x="${x}" y="${y(p.gs)}" width="${bw}" height="${y(p.ge)-y(p.gs)}" fill="var(--treat)" opacity=".85"/>
   <line x1="${x-46}" y1="${y(0)}" x2="${x+bw+6}" y2="${y(0)}" stroke="var(--ink)" stroke-width="2"/>
   <text x="4" y="${y(0)-7}" font-size="10.5" font-weight="700" fill="var(--ink)">collar ${f(p.egl)} mSHD</text>`;
  for(let d=5;d<=p.ge;d+=5)
    s+=`<line x1="${x-6}" y1="${y(d)}" x2="${x}" y2="${y(d)}" stroke="var(--rule)"/>
        <text x="${x-9}" y="${y(d)+3.4}" text-anchor="end" font-size="9" fill="var(--ink2)">${d}</text>`;
  if(withStages) stagesFor(p).forEach((st,i)=>{
    if(i===active) s+=`<rect x="${x}" y="${y(st.from)}" width="${bw}" height="${y(st.to)-y(st.from)}"
        fill="none" stroke="var(--ink)" stroke-width="2.5"/>`;
    s+=`<line x1="${x}" y1="${y(st.from)}" x2="${x+bw}" y2="${y(st.from)}" stroke="#fff" stroke-width="1.8"/>
        <text x="${x+bw/2}" y="${(y(st.from)+y(st.to))/2+4}" text-anchor="middle"
          font-size="12" font-weight="700" fill="#fff">S${st.no}</text>`;
  });
  [[p.gs,'grout from '+f(p.gs)],[p.ge,'drill to '+f(p.ge)]].forEach(([d,t])=>{
    s+=`<line x1="${x-6}" y1="${y(d)}" x2="${x+bw+6}" y2="${y(d)}" stroke="var(--ink)" stroke-width="1.5"/>
        <text x="${x-9}" y="${y(d)+3.4}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink)">${t}</text>
        <text x="${x+bw+10}" y="${y(d)+3.4}" font-size="9" fill="var(--ink2)">${f(lvl(d))} mSHD</text>`;
  });
  return s+`<text x="${x-9}" y="${H-4}" text-anchor="end" font-size="9" fill="var(--ink2)">m along hole</text></svg>`;
}

const BANNER=`<div class="banner"><b>Check the drawing revision before you start.</b>
  On Rev 01 dated 21/08/26 the layout sheet (1 of 3) came back marked &ldquo;contractor to revise and resubmission required&rdquo;,
  with an open comment asking where the GI overlapping is. Sheets 2 and 3, which carry these point figures, are marked
  &ldquo;no objection to use in construction&rdquo;.</div>`;
const FOOT=`<p class="foot">Every figure on the drilling tab is taken from the coordinate tables on
  CR207-SNHYD-TUN1-G-TMP-DR-LPL-2511 and -2512, Rev 01 dated 21/08/26, checked field by field against this app.
  Azimuth and pitch are derived from those coordinates. Volume and termination criteria come from the Grouting
  Methodology note on the same drawing.</p>`;

function render(){
  const p=DATA[cur];
  [...chips.children].forEach((c,i)=>c.setAttribute('aria-pressed',i===cur?'true':'false'));
  document.getElementById('nowId').textContent=p.id;
  const tg=document.getElementById('nowTag');
  tg.textContent=p.type; tg.style.background=COL[p.type];
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===DATA.length-1;
  if(tab==='D') renderDrill(p); else renderGrout(p);
}

function renderDrill(p){
  document.getElementById('panelD').innerHTML=BANNER+`
    <div class="lede"><span class="v">${f(p.ge)}</span><span class="u">m</span>
      <span class="k">Drill this depth, measured along the hole from the collar</span></div>
    <div class="pair">
      <div class="box"><div class="k">Azimuth (grid)</div><div class="v">${f(p.az,1)}&deg;</div></div>
      <div class="box"><div class="k">LiPAD pitch</div><div class="v">${f(90-p.ang,1)}&deg;</div></div>
    </div>
    <h2>Setting out</h2>
    <dl>
      <dt>Angle from vertical</dt><dd>${f(p.ang)}&deg;</dd>
      <dt>Collar easting</dt><dd>${f(p.cE,3)}</dd>
      <dt>Collar northing</dt><dd>${f(p.cN,3)}</dd>
      <dt>Toe easting (plan)</dt><dd>${f(p.tE,3)}</dd>
      <dt>Toe northing (plan)</dt><dd>${f(p.tN,3)}</dd>
      <dt>Collar level</dt><dd>${f(p.egl)} mSHD</dd>
      <dt>Point type</dt><dd>${p.type}</dd>
    </dl>
    <h2>Hole section</h2>
    ${section(p,false,-1)}
    <p class="hint">Red band is the treatment zone. Set the mast with the LiPAD before starting.</p>`+FOOT;
}

function renderGrout(p){
  const st=stagesFor(p);
  if(stg>=st.length) stg=0;
  const a=st[stg];
  document.getElementById('panelG').innerHTML=BANNER+`
    <div class="lede"><span class="v">${Math.round(p.tl*RATE)}</span><span class="u">L</span>
      <span class="k">Limiting volume for the hole at 350 L/m, over ${st.length} stage${st.length>1?'s':''}</span></div>
    <div class="span" style="border:1px solid var(--rule);background:#fff">
      <div><div class="k">Zone starts</div><div class="v">${f(p.gs)}</div><div class="u">m</div></div>
      <div class="mid">&#8594;</div>
      <div><div class="k">Zone ends</div><div class="v">${f(p.ge)}</div><div class="u">m</div></div>
      <div class="mid">=</div>
      <div><div class="k">Length</div><div class="v">${f(p.tl)}</div><div class="u">m</div></div>
    </div>
    <h2>Stage</h2>
    <div class="seg" id="seg">${st.map((s,i)=>
      `<button type="button" aria-pressed="${i===stg}" data-i="${i}"><b>S${s.no}</b>${Math.round(s.vol)} L</button>`).join('')}</div>
    <div class="stage">
      <div class="hd"><span class="no">Stage ${a.no}</span>
        <span style="font-size:13px;color:var(--ink2)">${f(a.len)} m</span>
        <span class="vol">${Math.round(a.vol)} L</span></div>
      <div class="span two">
        <div><div class="k">Depth from</div><div class="v">${f(a.from)}</div><div class="u">m along hole</div></div>
        <div class="mid">&#8594;</div>
        <div><div class="k">Depth to</div><div class="v">${f(a.to)}</div><div class="u">m along hole</div></div>
      </div>
      <ol class="steps">${SPLIT.map(([wc,lt],i)=>
        `<li class="step"><span class="n">Step ${i+1}</span><span class="wc">W/C ${wc.toFixed(1)}</span>
          <span class="lt">${Math.round(lt*a.vol/FULL)} L</span></li>`).join('')}</ol>
    </div>
    <div class="crit">
      <h4>Stop this stage when either applies</h4>
      <ul>
        <li>The stage has taken its limiting volume of <b>${Math.round(a.vol)} L</b>.</li>
        <li>Pressure has held at the agreed Pmax, ${PMIN}&ndash;${PMAX} bar, for a full 5 minutes with flow
            under ${FLOW} L per metre per minute &mdash; <b>${(FLOW*a.len).toFixed(1)} L/min</b> over this ${f(a.len)} m stage.</li>
      </ul>
    </div>
    <h2>Where this stage sits</h2>
    ${section(p,true,stg)}
    <div class="dir"><label for="dirSel">Stages run from</label>
      <select id="dirSel">
        <option value="up"${dir==='up'?' selected':''}>bottom of hole upward</option>
        <option value="down"${dir==='down'?' selected':''}>top of zone downward</option>
      </select></div>
    <p class="note"><b>Confirm before grouting.</b> The 350 L/m limiting volume, the 10&ndash;15 bar Pmax and the
      5 minute hold with flow under 2 L/m/min are read straight off the approved drawing. Everything else about the
      staging is not on that drawing and has been taken from the water/cement ratio chart: the 5 m stage length, the
      500 / 1000 / 250 L split of a full 1750 L stage, the pro-rata split of a part stage, and staging from the bottom
      upward. That chart also shows ratio changes triggered at 15 and 20 bar, which sit above the approved 10&ndash;15
      bar Pmax, so the trigger for changing ratio needs to be settled with the engineer before use.</p>`+FOOT;
  document.getElementById('dirSel').onchange=e=>{dir=e.target.value;stg=0;render();};
  document.getElementById('seg').onclick=e=>{
    const b=e.target.closest('button'); if(!b)return;
    stg=+b.dataset.i; render();
  };
}
setTab('D'); render();
</script></body></html>
